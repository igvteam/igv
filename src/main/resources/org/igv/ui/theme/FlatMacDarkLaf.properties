#
# IGV overrides for FlatMacDarkLaf, which uses the "filled" checkbox icon style and therefore reads a different
# set of keys than the ones in FlatDarkLaf.properties.  Only the unselected box is lightened; the selected
# background is left as @accentColor so it keeps following the macOS accent color.
#

CheckBox.icon[filled].background    = lighten(@background,15%,derived noAutoInverse)
RadioButton.icon[filled].background = lighten(@background,15%,derived noAutoInverse)
