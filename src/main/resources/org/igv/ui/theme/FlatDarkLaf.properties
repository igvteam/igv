#
# IGV overrides for FlatLaf's dark themes.
#
# Loaded via FlatLaf.registerCustomDefaultsSource("org.igv.ui.theme") in Main.initializeLookAndFeel().
# FlatDarculaLaf and FlatMacDarkLaf both extend FlatDarkLaf, so this file applies to every dark theme IGV offers.
#
# Testers reported that stock FlatLaf scrollbars and checkboxes are too dark to pick out against the window
# background.  FlatLaf derives both from @background with a small lift (thumb is only ~10% lighter than the
# track), so we lift them further.  Values are derived rather than hardcoded so they track each theme's own
# background -- FlatMacDarkLaf's is considerably darker than FlatDarkLaf's.
#

#---- ScrollBar ----

ScrollBar.track             = lighten(@background,5%,derived noAutoInverse)
ScrollBar.thumb             = lighten(@background,25%,derived noAutoInverse)
ScrollBar.hoverThumbColor   = lighten(@background,34%,derived noAutoInverse)
ScrollBar.pressedThumbColor = lighten(@background,42%,derived noAutoInverse)

#---- CheckBox / RadioButton ----

CheckBox.icon.borderColor            = lighten(@background,32%,derived noAutoInverse)
CheckBox.icon.background             = lighten(@background,13%,derived noAutoInverse)
CheckBox.icon.selectedBorderColor    = lighten(@background,42%,derived noAutoInverse)
CheckBox.icon.selectedBackground     = lighten(@background,13%,derived noAutoInverse)
CheckBox.icon.checkmarkColor         = lighten(@foreground,18%,derived noAutoInverse)

RadioButton.icon.borderColor         = lighten(@background,32%,derived noAutoInverse)
RadioButton.icon.background          = lighten(@background,13%,derived noAutoInverse)
RadioButton.icon.selectedBorderColor = lighten(@background,42%,derived noAutoInverse)
RadioButton.icon.selectedBackground  = lighten(@background,13%,derived noAutoInverse)
RadioButton.icon.checkmarkColor      = lighten(@foreground,18%,derived noAutoInverse)
